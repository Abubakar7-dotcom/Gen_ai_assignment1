# Fresh-clone deployment test: exactly what the evaluator does (clone -> docker compose up --build -> browser),
# on a clean Linux runner with no models present. Models are fetched by the backend container on first start.
name: docker-compose-e2e

on:
  push:
    branches: [main]
    paths: ["backend/**", "frontend/**", "src/data/corruptions.py", "docker-compose.yml", ".dockerignore",
            "tests/smoke_app.py", ".github/workflows/docker.yml"]
  workflow_dispatch:

jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Start the application (one documented command)
        run: docker compose up --build -d

      - name: Wait until the app answers through nginx
        run: |
          for i in $(seq 1 120); do
            if curl -sf http://localhost:8080/api/health > /dev/null; then echo "up after $((i*10)) s"; exit 0; fi
            sleep 10
          done
          echo "app did not come up"; exit 1

      - name: End-to-end smoke test (all four workspaces + upload validation)
        run: python3 tests/smoke_app.py http://localhost:8080

      - name: Restart reuses the downloaded models
        run: |
          docker compose restart
          for i in $(seq 1 60); do curl -sf http://localhost:8080/api/health > /dev/null && break; sleep 5; done
          docker compose logs backend | tail -n 12
          python3 tests/smoke_app.py http://localhost:8080

      - name: Container status and logs
        if: always()
        run: |
          docker compose ps
          docker compose logs --no-color | tail -n 80

      - name: Stop
        if: always()
        run: docker compose down
