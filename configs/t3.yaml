# Task 3 - soft mixture of experts (initialised from Task 2 checkpoints)
run_name: t3-soft-moe
out_dir: checkpoints/t3
classifier_ckpt: checkpoints/t2_cls/best.pt
specialist_ckpts:
  salt_pepper: checkpoints/t2_spec_salt_pepper/best.pt
  blur: checkpoints/t2_spec_blur/best.pt
  occlusion: checkpoints/t2_spec_occlusion/best.pt
tau: 1.0
l1_w: 0.8
ssim_w: 0.2
ce_w: 0.1
bal_w: 0.01
warmup_epochs: 3      # experts frozen, gate only
joint_epochs: 12      # everything trainable
gate_lr: 0.001
joint_lr: 0.0001
batch_size: 32
collapse_thr: 0.9
num_workers: 0    # Windows: every worker re-imports CUDA torch (1-4 GB commit each), see docs/decisions.md
